[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 800
via_ir = false
bytecode_hash = "none"
gas_reports = ["StreetsOfGainsRewards"]

# Read-only access to the Phase 2D backend attestation fixture (generated by
# the vitest suite). No write access is granted to any path.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

# The DogeOS fork rehearsal needs network egress and a cancun-era EVM (the live
# WDOGE bytecode uses post-paris opcodes), so it is excluded from the default run.
#   FOUNDRY_PROFILE=fork forge test --match-path test/StreetsOfGainsRewards.dogeosFork.t.sol
no_match_path = "test/StreetsOfGainsRewards.dogeosFork.t.sol"

remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[fmt]
line_length = 110

# Phase 2C: fuzz depth raised well above the 256 default for the accounting invariants.
[fuzz]
runs = 1024

[invariant]
runs = 512
depth = 100
fail_on_revert = false
call_override = false
shrink_run_limit = 2000

